<svg width="1024" height="500" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="60%" stop-color="#0F0F0F"/>
      <stop offset="100%" stop-color="#150900"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="85%" r="60%" fx="50%" fy="85%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FB923C" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="35%" stop-color="#FB923C"/>
      <stop offset="55%" stop-color="#FDBA74"/>
      <stop offset="80%" stop-color="#E8E4E0"/>
      <stop offset="100%" stop-color="#E0DEDA"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1024" height="500" fill="url(#bgGrad)"/>
  <rect width="1024" height="500" fill="url(#bgGlow)"/>

  <!-- Logo centered: original is ~460w x ~170h (text area), center of 1024x500 = 512,250 -->
  <!-- Logo content spans x=46..451, y=147..316 in original = width ~405, height ~169 -->
  <!-- Center: translate so logo midpoint (228, 232) maps to (512, 250) -->
  <g transform="translate(254, 18) scale(1.0)">
    <!-- OFA text -->
    <text x="46" y="316"
          font-family="'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"
          font-size="180" font-weight="900" letter-spacing="-10" fill="url(#textGrad)"
          stroke="url(#textGrad)" stroke-width="8" paint-order="stroke">OFA</text>

    <!-- i -->
    <g transform="translate(401, 147)">
      <rect x="0" y="48" width="50" height="126" rx="5" fill="#E0DEDA"/>
      <g transform="translate(25, 12) rotate(-90)">
        <path d="M -34,0 L -14,-21 Q -10,-25 -4,-25 L 20,-25 Q 27,-25 27,-18 L 27,18 Q 27,25 20,25 L -4,25 Q -10,25 -14,21 Z" fill="#E0DEDA"/>
        <circle cx="-18" cy="0" r="5" fill="#0F0F0F"/>
      </g>
    </g>
  </g>
</svg>
