name: ofai_flutter
description: "OFAI - Oferte si reduceri din Romania"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^2.6.1
  go_router: ^14.8.1
  dio: ^5.7.0
  flutter_secure_storage: ^9.2.4
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  google_fonts: ^6.2.1
  geolocator: ^13.0.2
  intl: ^0.20.2
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  package_info_plus: ^8.1.3
  shared_preferences: ^2.3.4
  firebase_core: ^3.8.1
  firebase_messaging: ^15.2.1
  firebase_analytics: ^11.4.2
  google_sign_in: ^6.2.1
  image_picker: ^1.1.2
  qr_flutter: ^4.1.0
  connectivity_plus: ^6.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  mocktail: ^1.0.4
  flutter_native_splash: ^2.4.3

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/

flutter_native_splash:
  color: "#06060A"
  image: assets/ofai-wordmark-nobg.png
  android_12:
    color: "#06060A"
    image: assets/ofai-splash-android12.png
    icon_background_color: "#06060A"
  ios: true
  android: true
