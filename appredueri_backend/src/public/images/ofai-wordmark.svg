<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="oGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FDBA74"/>
      <stop offset="100%" stop-color="#EA780C"/>
    </linearGradient>
    <!-- Background: dark top → deep burnt orange bottom -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0F0F0F"/>
      <stop offset="60%" stop-color="#0F0F0F"/>
      <stop offset="100%" stop-color="#150900"/>
    </linearGradient>
    <!-- Radial ambient glow from bottom center -->
    <radialGradient id="bgGlow" cx="50%" cy="85%" r="60%" fx="50%" fy="85%">
      <stop offset="0%" stop-color="#FB923C" stop-opacity="0.08"/>
      <stop offset="50%" stop-color="#FB923C" stop-opacity="0.02"/>
      <stop offset="100%" stop-color="#FB923C" stop-opacity="0"/>
    </radialGradient>
    <!-- Text gradient: orange left → off-white right -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F97316"/>
      <stop offset="35%" stop-color="#FB923C"/>
      <stop offset="55%" stop-color="#FDBA74"/>
      <stop offset="80%" stop-color="#E8E4E0"/>
      <stop offset="100%" stop-color="#E0DEDA"/>
    </linearGradient>
  </defs>

  <!-- Background gradient -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>
  <!-- Ambient orange glow -->
  <rect width="512" height="512" rx="64" fill="url(#bgGlow)"/>

  <!-- OFA text — bolder: stroke + tighter spacing -->
  <text x="46" y="316"
        font-family="'Inter', 'Segoe UI', Helvetica, Arial, sans-serif"
        font-size="180" font-weight="900" letter-spacing="-10" fill="url(#textGrad)"
        stroke="url(#textGrad)" stroke-width="8" paint-order="stroke">
    OFA</text>

  <!-- i — bolder, aligned to OFA baseline (316) -->
  <g transform="translate(401, 147)">
    <!-- i stem — wider to match bold OFA -->
    <rect x="0" y="48" width="50" height="126" rx="5" fill="#E0DEDA"/>

    <!-- Price tag dot — proportionally bigger -->
    <g transform="translate(25, 12) rotate(-90)">
      <path d="
        M -34,0
        L -14,-21
        Q -10,-25 -4,-25
        L 20,-25
        Q 27,-25 27,-18
        L 27,18
        Q 27,25 20,25
        L -4,25
        Q -10,25 -14,21
        Z
      " fill="#E0DEDA"/>
      <!-- Tag hole -->
      <circle cx="-18" cy="0" r="5" fill="#0F0F0F"/>
    </g>
  </g>
</svg>
